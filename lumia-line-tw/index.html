<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>露米雅皮膚科 Lumia Clinic</title>
<style>
  body { margin: 0; font-family: "Songti TC", "PMingLiU", serif; background: #faf6f3; color: #3a2e2a; text-align: center; }
  .wrap { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 28px; }
  .spin { width: 36px; height: 36px; margin: 0 auto 20px; border: 3px solid #e6dcd6; border-top-color: #06c755; border-radius: 50%; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  p { font-size: 14px; color: #7a6a63; margin: 0 0 28px; line-height: 1.7; font-family: sans-serif; }
  a.btn { display: none; max-width: 320px; margin: 0 auto; padding: 16px; border-radius: 999px; background: #06c755; color: #fff; text-decoration: none; font-family: sans-serif; font-weight: 700; font-size: 16px; }
</style>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="wrap">
  <h1>露米雅皮膚科 Lumia Clinic</h1>
  <div class="spin" id="spin"></div>
  <p id="msg">即將開啟LINE聊天室</p>
  <a class="btn" id="btn" href="#">用LINE諮詢</a>
</div>
<script>
  // 랜딩 버튼 → https://liff.line.me/<LIFF_ID>?cid=..&fbclid=..&fbp=..&fbc=..
  // 여기서 라인 로그인 ID 토큰을 웹앱에 보내 "이 라인 사용자 = 이 광고 클릭"을 묶고, 바로 상담 대화창을 연다.
  var LIFF_ID = '2012294400-1oQm2T7j';
  var GAS = 'https://script.google.com/macros/s/AKfycbzLewLi8zqCiKIJfLKQfFUHwT6GXHsH5lVE_0OhmqxmveFYkhTBQ7IPfjKYbW_TYqdfcw/exec';
  var CHAT = 'https://line.me/R/oaMessage/' + encodeURIComponent('@904ijuar') + '/';

  var btn = document.getElementById('btn');
  btn.href = CHAT;
  function openChat() {
    location.replace(CHAT);
    // 그래도 안 넘어가면 버튼을 보여 준다
    setTimeout(function () {
      document.getElementById('spin').style.display = 'none';
      document.getElementById('msg').textContent = '若聊天室沒有開啟，請按下按鈕。';
      btn.style.display = 'block';
    }, 2500);
  }
  function newCid() {
    var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    for (var i = 0; i < 6; i++) s += abc[Math.floor(Math.random() * abc.length)];
    return s;
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    var q = new URLSearchParams(location.search);
    var body = {
      idToken: liff.getIDToken(),
      cid: q.get('cid') || newCid(),
      fbclid: q.get('fbclid') || '', fbp: q.get('fbp') || '', fbc: q.get('fbc') || '',
      ua: navigator.userAgent, url: q.get('lp') || 'liff'
    };
    // 웹앱 응답(2~3초)을 기다리지 않는다: sendBeacon은 페이지를 떠나도 전송이 이어진다
    var data = JSON.stringify(body), sent = false;
    try { sent = navigator.sendBeacon(GAS + '?a=liff', data); } catch (e) {}
    if (!sent) fetch(GAS + '?a=liff', { method: 'POST', body: data, keepalive: true });
    setTimeout(openChat, 300);
  }).catch(function () { openChat(); });
</script>
</body>
</html>
