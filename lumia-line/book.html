<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご予約 | LUMIA CLINIC ソウル</title>
<style>
  :root { --bg: #faf6f3; --ink: #3a2e2a; --sub: #7a6a63; --line: #e6dcd6; --green: #06c755; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 28px 20px 40px; }
  h1 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 21px; font-weight: 600; margin: 0 0 6px; text-align: center; }
  .lead { font-size: 13px; color: var(--sub); text-align: center; margin: 0 0 28px; line-height: 1.7; }
  label.t { display: block; font-size: 14px; font-weight: 700; margin: 22px 0 8px; }
  label.t small { font-weight: 400; color: var(--sub); margin-left: 4px; }
  .req { color: #d0454c; font-size: 11px; margin-left: 4px; }
  input[type=text], input[type=date], textarea { width: 100%; padding: 13px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-family: inherit; }
  textarea { min-height: 88px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips input { display: none; }
  .chips span { display: inline-block; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 14px; }
  .chips input:checked + span { border-color: var(--green); background: #eafaf0; color: #04813a; font-weight: 700; }
  .err { color: #d0454c; font-size: 13px; min-height: 20px; margin: 18px 0 0; text-align: center; }
  button { display: block; width: 100%; margin-top: 10px; padding: 16px; border: 0; border-radius: 999px; background: var(--green); color: #fff; font-size: 16px; font-weight: 700; font-family: inherit; }
  button:disabled { opacity: .5; }
  .note { font-size: 12px; color: var(--sub); text-align: center; margin-top: 14px; line-height: 1.6; }
  #done { display: none; text-align: center; padding-top: 60px; }
  #done .ok { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%; background: var(--green); color: #fff; font-size: 30px; line-height: 56px; }
  #done p { font-size: 14px; color: var(--sub); line-height: 1.8; margin: 0 0 28px; }
</style>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="wrap">
  <form id="f" novalidate>
    <h1>ご予約・ご相談の申し込み</h1>
    <p class="lead">LUMIA CLINIC ソウル<br>送信後、担当者がLINEでご連絡します。</p>

    <label class="t">お名前<span class="req">必須</span></label>
    <input type="text" name="nm" autocomplete="name" placeholder="山田 花子">

    <label class="t">ご希望の施術<span class="req">必須</span><small>複数選択可</small></label>
    <div class="chips" id="items">
      <label><input type="checkbox" value="リジュラン"><span>リジュラン</span></label>
      <label><input type="checkbox" value="オンダリフティング"><span>オンダリフティング</span></label>
      <label><input type="checkbox" value="相談して決めたい"><span>相談して決めたい</span></label>
    </div>

    <label class="t">ご来院希望日<span class="req">必須</span></label>
    <input type="date" name="date" id="date">

    <label class="t">ご希望の時間帯</label>
    <div class="chips">
      <label><input type="radio" name="time" value="午前"><span>午前</span></label>
      <label><input type="radio" name="time" value="午後"><span>午後</span></label>
      <label><input type="radio" name="time" value="どちらでも" checked><span>どちらでも</span></label>
    </div>

    <label class="t">ご来院人数</label>
    <div class="chips">
      <label><input type="radio" name="people" value="1名" checked><span>1名</span></label>
      <label><input type="radio" name="people" value="2名"><span>2名</span></label>
      <label><input type="radio" name="people" value="3名以上"><span>3名以上</span></label>
    </div>

    <label class="t">ご質問・ご要望<small>任意</small></label>
    <textarea name="note" placeholder="気になる部位、韓国滞在期間など"></textarea>

    <p class="err" id="err"></p>
    <button type="submit" id="go">この内容で申し込む</button>
    <p class="note">まだ予約は確定していません。<br>担当者からのご連絡で確定となります。</p>
  </form>

  <div id="done">
    <div class="ok">✓</div>
    <h1>お申し込みありがとうございます</h1>
    <p id="doneMsg">内容をトークに送りました。<br>担当者より順番にご連絡いたします。</p>
    <button type="button" id="close">トークに戻る</button>
  </div>
</div>
<script>
  // 라인 리치 메뉴·상담 중 링크로 연다: https://liff.line.me/<BOOK_LIFF_ID>
  // 제출하면 ① 웹앱(?a=book)에 기록·메타 Schedule ② 고객 이름으로 대화창에 요약을 올려 상담사가 채팅에서 바로 본다.
  // ?preview=1 이면 라인 없이 화면만 본다(디자인 확인용).
  var BOOK_LIFF_ID = '2012269773-pFMODDg6';  // 새 LIFF 앱(scope: openid + chat_message.write) ID
  var GAS = 'https://script.google.com/macros/s/AKfycbz75UI7P8SJdwq1pPyMpPh9OT8B-G9ufX_fEwOQ2q89Y-KNmjal2Kqc3ZE8FSI0Jy_1-w/exec';
  var CHAT = 'https://line.me/R/oaMessage/' + encodeURIComponent('@811edwqi') + '/';
  var prefill = '';
  var PREVIEW = new URLSearchParams(location.search).get('preview') === '1' || typeof liff === 'undefined';

  var f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  var d = new Date(); d.setDate(d.getDate() + 1);
  document.getElementById('date').min = d.toISOString().slice(0, 10);

  var ready = PREVIEW ? Promise.resolve() : liff.init({ liffId: BOOK_LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) liff.login({ redirectUri: location.href });
  });

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var b = {
      name: f.nm.value.trim(),
      items: [].map.call(document.querySelectorAll('#items input:checked'), function (x) { return x.value; }),
      date: f.date.value, time: f.time.value, people: f.people.value, note: f.note.value.trim()
    };
    if (!b.name) return show('お名前を入力してください');
    if (!b.items.length) return show('ご希望の施術を選んでください');
    if (!b.date) return show('ご来院希望日を選んでください');
    show(''); go.disabled = true; go.textContent = '送信中…';

    var summary = '【ご予約申し込み】\nお名前：' + b.name + '\n施術：' + b.items.join('、') +
      '\n希望日：' + b.date.replace(/-/g, '/') + '（' + b.time + '）\n人数：' + b.people +
      (b.note ? '\nご要望：' + b.note : '');

    ready.then(function () {
      if (PREVIEW) return;
      b.idToken = liff.getIDToken();
      var save = fetch(GAS + '?a=book', { method: 'POST', body: JSON.stringify(b), keepalive: true }).catch(function () {});
      // sendMessages는 폼을 '연 대화방'에 올린다. 공식계정 1:1 대화(리치 메뉴·상담 링크)에서 연 경우만 쓰고,
      // 그 밖(다른 대화방·외부 브라우저)이거나 실패하면 공식계정 대화창에 내용을 미리 채워 열어 준다(고객이 전송 한 번).
      var ctx = (liff.getContext() || {}).type;
      var chat = liff.isInClient() && ctx === 'utou'
        ? liff.sendMessages([{ type: 'text', text: summary }]).then(function () { return true; }, function () { return false; })
        : Promise.resolve(false);
      return Promise.all([save, chat]).then(function (r) { if (!r[1]) prefill = CHAT + '?' + encodeURIComponent(summary); });
    }).then(function () {
      if (prefill) {
        document.getElementById('doneMsg').innerHTML = 'ボタンを押すとトーク画面が開きます。<br>そのまま<b>送信</b>してください。';
        document.getElementById('close').textContent = '内容をトークで送る';
      }
      f.style.display = 'none';
      document.getElementById('done').style.display = 'block';
      window.scrollTo(0, 0);
    });
  });

  document.getElementById('close').onclick = function () {
    if (prefill) location.href = prefill; else if (!PREVIEW && liff.isInClient()) liff.closeWindow(); else location.href = CHAT;
  };
  function show(m) { err.textContent = m; }
</script>
</body>
</html>
