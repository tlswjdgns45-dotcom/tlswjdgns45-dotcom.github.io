<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMIA CLINIC ソウル</title>
<style>
  body { margin: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; background: #faf6f3; color: #3a2e2a; text-align: center; }
  .wrap { padding: 72px 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 14px; color: #7a6a63; margin: 0 0 28px; line-height: 1.7; }
  a.btn { display: none; max-width: 320px; margin: 0 auto; padding: 16px; border-radius: 999px; background: #06c755; color: #fff; text-decoration: none; font-family: sans-serif; font-weight: 700; font-size: 16px; }
</style>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="wrap">
  <h1>LUMIA CLINIC ソウル</h1>
  <p id="msg">LINEのトーク画面を開いています…</p>
  <a class="btn" id="btn" href="#">LINEで相談する</a>
</div>
<script>
  // 랜딩 버튼 → https://liff.line.me/<LIFF_ID>?cid=..&fbclid=..&fbp=..&fbc=..
  // 여기서 라인 로그인 ID 토큰을 웹앱에 보내 "이 라인 사용자 = 이 광고 클릭"을 묶고, 바로 상담 대화창을 연다.
  var LIFF_ID = '2012269773-ndbeZt7j';
  var GAS = 'https://script.google.com/macros/s/AKfycbz75UI7P8SJdwq1pPyMpPh9OT8B-G9ufX_fEwOQ2q89Y-KNmjal2Kqc3ZE8FSI0Jy_1-w/exec';
  var CHAT = 'https://line.me/R/oaMessage/' + encodeURIComponent('@811edwqi') + '/';

  var btn = document.getElementById('btn');
  btn.href = CHAT;
  function openChat() {
    btn.style.display = 'block';
    document.getElementById('msg').textContent = 'トーク画面が開かない場合はボタンを押してください。';
    location.replace(CHAT);
  }
  function newCid() {
    var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    for (var i = 0; i < 6; i++) s += abc[Math.floor(Math.random() * abc.length)];
    return s;
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    var q = new URLSearchParams(location.search);
    var body = {
      idToken: liff.getIDToken(),
      cid: q.get('cid') || newCid(),
      fbclid: q.get('fbclid') || '', fbp: q.get('fbp') || '', fbc: q.get('fbc') || '',
      ua: navigator.userAgent, url: q.get('lp') || 'liff'
    };
    var done = false;
    function go() { if (!done) { done = true; openChat(); } }
    setTimeout(go, 4000);
    fetch(GAS + '?a=liff', { method: 'POST', body: JSON.stringify(body) }).then(go, go);
  }).catch(function () { openChat(); });
</script>
</body>
</html>
